<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKPD: Fase 1 - Konsep VPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #e5e7eb;
            color: #1f2937;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* A4 Paper Style */
        .lkpd-paper {
            background: #ffffff;
            width: 100%;
            max-width: 210mm;
            padding: 40px 50px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 3px solid #1f2937;
            padding-bottom: 10px;
        }

        /* Header Form */
        .header-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            align-items: center;
        }

        .input-group label {
            font-weight: 600;
            width: 100px;
        }

        .input-group input[type="text"] {
            flex: 1;
            border: none;
            border-bottom: 1px dashed #4b5563;
            padding: 5px;
            font-size: 15px;
            background: transparent;
            outline: none;
            transition: border-bottom 0.3s;
            color: #1f2937;
        }

        .input-group input[type="text"]:focus {
            border-bottom: 2px solid #2563eb;
        }

        h2 {
            font-size: 18px;
            background: #1f2937;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            margin: 10px 0 15px 0;
        }

        p {
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Card / Textarea Boxes */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 15px;
            background: #f9fafb;
            transition: box-shadow 0.3s;
        }
        
        .box:hover {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .box strong {
            display: block;
            margin-bottom: 12px;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .box textarea {
            width: 100%;
            height: 120px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 10px;
            resize: none;
            font-family: inherit;
            outline: none;
            font-size: 14px;
            color: #047857; /* Warna hijau untuk teks jawaban */
            font-weight: 500;
            line-height: 1.5;
        }

        .box textarea:focus {
            border-color: #2563eb;
            background-color: #ffffff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-section, .grid-2 {
                grid-template-columns: 1fr;
            }
            .lkpd-paper {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="lkpd-paper">
    <h1>LKPD: Manajemen Server VPS AWS</h1>

    <!-- Bagian Header Tanpa Instruktur -->
    <div class="header-section">
        <div class="input-group">
            <label>Nama</label>
            <span>:</span>
            <input type="text" value="Raka Raditya Karim">
        </div>
        <div class="input-group">
            <label>Tanggal</label>
            <span>:</span>
            <input type="text" value="15 Oktober 2026">
        </div>
        <div class="input-group">
            <label>Kelas</label>
            <span>:</span>
            <input type="text" value="XI PPLG">
        </div>
    </div>

    <!-- Fase 1 Saja -->
    <h2>Fase 1: Pengenalan Konsep VPS & Cloud</h2>
    <p>Jelaskan secara singkat pemahaman Anda mengenai perbedaan layanan berikut dengan mengisi kotak yang tersedia.</p>
    
    <div class="grid-2">
        <div class="box">
            <strong>Shared Hosting</strong>
            <textarea>Layanan hosting di mana satu server fisik dibagi dan digunakan bersama oleh banyak pengguna. Harga sewanya sangat murah, namun performa website dapat menurun apabila ada pengguna lain dalam satu server yang menggunakan sumber daya berlebih.</textarea>
        </div>
        <div class="box">
            <strong>Dedicated Server</strong>
            <textarea>Layanan penyewaan di mana satu server fisik secara utuh didedikasikan hanya untuk satu pengguna. Memberikan privasi tingkat tinggi, kendali penuh atas konfigurasi server, dan performa maksimal, tetapi dengan biaya yang mahal.</textarea>
        </div>
        <div class="box">
            <strong>Amazon Lightsail</strong>
            <textarea>Layanan cloud VPS (Virtual Private Server) dari AWS yang dirancang sangat user-friendly. Memiliki harga tetap (flat-rate) per bulan, sehingga sangat cocok untuk pemula atau developer yang ingin melakukan deployment aplikasi secara cepat dan instan.</textarea>
        </div>
        <div class="box">
            <strong>Amazon EC2</strong>
            <textarea>Layanan komputasi awan berkinerja tinggi dari AWS yang sangat fleksibel dan skalabel. Pengguna memiliki kontrol mendetail atas infrastruktur dan menggunakan sistem pembayaran pay-as-you-go. Cocok untuk aplikasi berarsitektur kompleks pada tingkat enterprise.</textarea>
        </div>
    </div>

</div>

</body>
</html>
